name: Verify
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  product:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        shard: [types, journey]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.20.0
      - run: npm install --global pnpm@10.12.4
      - run: pnpm install --frozen-lockfile
      - if: matrix.shard == 'types'
        run: pnpm run typecheck && pnpm exec rer check --profile first-party
      - if: matrix.shard == 'journey'
        run: pnpm exec playwright install --with-deps chromium
      - if: matrix.shard == 'journey'
        run: pnpm verify
  verify:
    needs: product
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test '${{ needs.product.result }}' = success
